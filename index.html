<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Timeline</title>

  <style>
    * { box-sizing: border-box; }

    :root {
      --blue: #007aff;
      --orange: #ff9500;
      --purple: #af52de;
      --green: #34c759;
      --ink: #1d1d1f;
      --muted: #727277;
      --line: #d2d2d7;
      --surface: #ffffff;
      --background: #f5f5f7;
    }

    body {
      margin: 0;
      padding: 30px;
      background: var(--background);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont,
        "Helvetica Neue", sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      max-width: 1000px;
      margin: auto;
    }

    .header {
      display: flex;
      gap: 18px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0 0 4px;
    }

    .todo-count {
      color: var(--muted);
    }

    .add-button {
      padding: 12px 18px;
      border: 0;
      border-radius: 12px;
      background: var(--blue);
      color: white;
      font-weight: 600;
    }

    .form-panel {
      display: none;
      padding: 22px;
      margin-bottom: 25px;
      background: var(--surface);
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
    }

    .form-panel.open {
      display: block;
    }

    .form-title {
      margin: 0 0 18px;
      font-size: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 15px;
    }

    .field {
      min-width: 0;
    }

    .field-label {
      display: block;
      margin-bottom: 7px;
      color: #666;
      font-size: 13px;
    }

    input[type="text"],
    input[type="date"],
    input[type="number"],
    select {
      width: 100%;
      height: 44px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: white;
      color: var(--ink);
    }

    .repeat-box {
      display: none;
      padding: 16px;
      margin-top: 16px;
      background: var(--background);
      border-radius: 12px;
    }

    .repeat-box.open {
      display: block;
    }

    .repeat-options {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 15px;
      align-items: end;
    }

    .weekly-options,
    .monthly-options {
      display: none;
    }

    .weekly-options.open,
    .monthly-options.open {
      display: block;
    }

    .weekday-row {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .weekday {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: white;
    }

    .weekday input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .weekday:has(input:checked) {
      border-color: var(--blue);
      background: var(--blue);
      color: white;
    }

    .form-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 18px;
    }

    .cancel-button,
    .save-button {
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 600;
    }

    .cancel-button {
      border: 1px solid var(--line);
      background: white;
    }

    .save-button {
      border: 0;
      background: var(--blue);
      color: white;
    }

    .range {
      margin-bottom: 18px;
      color: #555;
      font-size: 18px;
      font-weight: 600;
    }

    #zoom {
      width: 100%;
      margin-bottom: 30px;
      accent-color: var(--blue);
    }

    .zoom-labels {
      display: flex;
      justify-content: space-between;
      margin-top: -22px;
      margin-bottom: 28px;
      color: #888;
      font-size: 12px;
    }

    .legend {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 12px;
    }

    .legend span::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 5px;
      border-radius: 50%;
    }

    .legend .schedule::before { background: var(--blue); }
    .legend .milestone::before { background: var(--orange); }
    .legend .goal::before { background: var(--purple); }
    .legend .todo::before { background: var(--green); }

    .timeline {
      position: relative;
      min-height: 350px;
      overflow: hidden;
      background: var(--surface);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      touch-action: none;
      user-select: none;
    }

    .timeline-line {
      position: absolute;
      top: 155px;
      right: 35px;
      left: 35px;
      height: 3px;
      background: var(--line);
    }

    .axis-start,
    .axis-end {
      position: absolute;
      top: 305px;
      color: #888;
      font-size: 13px;
    }

    .axis-start {
      left: 25px;
    }

    .axis-end {
      right: 25px;
    }

    .event {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 0;
    }

    .point {
      position: absolute;
      top: 146px;
      left: -9px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      box-shadow: 0 0 0 6px rgba(0, 122, 255, 0.12);
    }

    .event-card {
      position: absolute;
      left: -68px;
      width: 136px;
      min-height: 67px;
      padding: 10px 8px;
      background: var(--background);
      border-radius: 12px;
      text-align: center;
    }

    .event.above .event-card {
      top: 27px;
    }

    .event.below .event-card {
      top: 188px;
    }

    .event-title {
      overflow: hidden;
      margin-bottom: 5px;
      font-size: 14px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .event-date,
    .repeat-label {
      color: #777;
      font-size: 12px;
    }

    .repeat-label {
      margin-top: 3px;
      color: var(--green);
    }

    .event.schedule .point { background: var(--blue); }
    .event.milestone .point { background: var(--orange); }
    .event.goal .point { background: var(--purple); }
    .event.todo .point { background: var(--green); }

    .event.completed .event-card {
      opacity: 0.48;
    }

    .event.completed .event-title {
      text-decoration: line-through;
    }

    .complete-button {
      position: absolute;
      top: -8px;
      left: -8px;
      width: 25px;
      height: 25px;
      padding: 0;
      border: 2px solid var(--green);
      border-radius: 50%;
      background: white;
      color: var(--green);
      font-size: 15px;
      font-weight: 700;
      line-height: 21px;
    }

    .completed .complete-button {
      background: var(--green);
      color: white;
    }

    .delete-button {
      position: absolute;
      top: -7px;
      right: -7px;
      width: 22px;
      height: 22px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: #d8d8dc;
      color: #555;
      line-height: 22px;
    }

    .empty-message {
      position: absolute;
      top: 110px;
      right: 20px;
      left: 20px;
      color: #888;
      text-align: center;
    }

    .hint {
      margin-top: 18px;
      color: #777;
      text-align: center;
    }

    .storage-note {
      margin-top: 8px;
      color: #999;
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 650px) {
      body {
        padding: 18px;
      }

      .header {
        align-items: flex-start;
      }

      .form-grid,
      .repeat-options {
        grid-template-columns: 1fr;
      }

      .event-card {
        left: -55px;
        width: 110px;
      }

      .event-title {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <div class="header">
      <div>
        <h1>My Timeline</h1>

        <div class="todo-count" id="todoCount">
          今日の未完了TO DO：0件
        </div>
      </div>

      <button
        class="add-button"
        id="openFormButton"
        type="button"
      >
        ＋ 追加
      </button>
    </div>

    <section class="form-panel" id="formPanel">
      <h2 class="form-title">
        新しい予定・目標・TO DO
      </h2>

      <form id="eventForm">
        <div class="form-grid">
          <div class="field">
            <label class="field-label" for="eventTitle">
              内容
            </label>

            <input
              id="eventTitle"
              type="text"
              placeholder="例：在庫を確認する"
              required
            >
          </div>

          <div class="field">
            <label class="field-label" for="eventDate">
              開始日・期限
            </label>

            <input
              id="eventDate"
              type="date"
              required
            >
          </div>

          <div class="field">
            <label class="field-label" for="eventType">
              種類
            </label>

            <select id="eventType">
              <option value="schedule">予定</option>
              <option value="milestone">節目</option>
              <option value="goal">目標</option>
              <option value="todo">TO DO</option>
            </select>
          </div>
        </div>

        <div class="repeat-box" id="repeatBox">
          <div class="repeat-options">
            <div class="field">
              <label class="field-label" for="repeatType">
                繰り返し
              </label>

              <select id="repeatType">
                <option value="none">なし</option>
                <option value="daily">毎日</option>
                <option value="weekly">毎週</option>
                <option value="monthly">毎月</option>
              </select>
            </div>

            <div class="weekly-options" id="weeklyOptions">
              <label class="field-label">
                曜日（複数選択可）
              </label>

              <div class="weekday-row">
                <label class="weekday">
                  <input type="checkbox" name="weekday" value="1">月
                </label>

                <label class="weekday">
                  <input type="checkbox" name="weekday" value="2">火
                </label>

                <label class="weekday">
                  <input type="checkbox" name="weekday" value="3">水
                </label>

                <label class="weekday">
                  <input type="checkbox" name="weekday" value="4">木
                </label>

                <label class="weekday">
                  <input type="checkbox" name="weekday" value="5">金
                </label>

                <label class="weekday">
                  <input type="checkbox" name="weekday" value="6">土
                </label>

                <label class="weekday">
                  <input type="checkbox" name="weekday" value="0">日
                </label>
              </div>
            </div>

            <div class="monthly-options" id="monthlyOptions">
              <label class="field-label" for="monthDay">
                毎月の日付（1〜31）
              </label>

              <input
                id="monthDay"
                type="number"
                min="1"
                max="31"
                value="1"
              >
            </div>
          </div>
        </div>

        <div class="form-actions">
          <button
            class="cancel-button"
            id="cancelButton"
            type="button"
          >
            キャンセル
          </button>

          <button class="save-button" type="submit">
            登録する
          </button>
        </div>
      </form>
    </section>

    <div class="range" id="rangeText">
      今後1年間
    </div>

    <input
      id="zoom"
      type="range"
      min="0"
      max="4"
      value="2"
      step="1"
    >

    <div class="zoom-labels">
      <span>今日</span>
      <span>1か月</span>
      <span>1年</span>
      <span>10年</span>
      <span>30年</span>
    </div>

    <div class="legend">
      <span class="schedule">予定</span>
      <span class="milestone">節目</span>
      <span class="goal">目標</span>
      <span class="todo">TO DO</span>
    </div>

    <section class="timeline" id="timeline">
      <div class="timeline-line"></div>
      <div id="events"></div>
      <div class="axis-start" id="axisStart"></div>
      <div class="axis-end" id="axisEnd"></div>
    </section>

    <div class="hint">
      白い部分でピンチすると、時間の範囲が変わります
    </div>

    <div class="storage-note">
      登録内容と完了履歴は、このブラウザ内に保存されます
    </div>
  </main>

  <script>
    const DAY = 24 * 60 * 60 * 1000;
    const STORAGE_KEY = "my-timeline-events";

    const ranges = [
      { label: "今日の予定", days: 1 },
      { label: "今後1か月", days: 31 },
      { label: "今後1年間", days: 365 },
      { label: "今後10年間", days: 3650 },
      { label: "今後30年間", days: 10950 }
    ];

    const weekdayNames = [
      "日", "月", "火", "水", "木", "金", "土"
    ];

    const zoom =
      document.getElementById("zoom");

    const rangeText =
      document.getElementById("rangeText");

    const timeline =
      document.getElementById("timeline");

    const eventsArea =
      document.getElementById("events");

    const axisStart =
      document.getElementById("axisStart");

    const axisEnd =
      document.getElementById("axisEnd");

    const todoCount =
      document.getElementById("todoCount");

    const formPanel =
      document.getElementById("formPanel");

    const eventForm =
      document.getElementById("eventForm");

    const eventTitle =
      document.getElementById("eventTitle");

    const eventDate =
      document.getElementById("eventDate");

    const eventType =
      document.getElementById("eventType");

    const repeatBox =
      document.getElementById("repeatBox");

    const repeatType =
      document.getElementById("repeatType");

    const weeklyOptions =
      document.getElementById("weeklyOptions");

    const monthlyOptions =
      document.getElementById("monthlyOptions");

    const monthDay =
      document.getElementById("monthDay");

    const openFormButton =
      document.getElementById("openFormButton");

    const cancelButton =
      document.getElementById("cancelButton");

    function makeId() {
      if (crypto.randomUUID) {
        return crypto.randomUUID();
      }

      return Date.now() + "-" + Math.random();
    }

    function todayAtNoon() {
      const date = new Date();

      date.setHours(12, 0, 0, 0);

      return date;
    }

    function dateFromText(text) {
      return new Date(text + "T12:00:00");
    }

    function dateToText(date) {
      const year = date.getFullYear();

      const month =
        String(date.getMonth() + 1).padStart(2, "0");

      const day =
        String(date.getDate()).padStart(2, "0");

      return `${year}-${month}-${day}`;
    }

    function addDays(date, numberOfDays) {
      const newDate = new Date(date);

      newDate.setDate(
        newDate.getDate() + numberOfDays
      );

      return newDate;
    }

    function formatDate(date) {
      return new Intl.DateTimeFormat(
        "ja-JP",
        {
          year: "numeric",
          month: "short",
          day: "numeric"
        }
      ).format(date);
    }

    function escapeText(text) {
      const element =
        document.createElement("div");

      element.textContent = text;

      return element.innerHTML;
    }

    function recurrenceLabel(item) {
      if (
        !item.recurrence ||
        item.recurrence.type === "none"
      ) {
        return "";
      }

      if (item.recurrence.type === "daily") {
        return "毎日";
      }

      if (item.recurrence.type === "weekly") {
        const days =
          (item.recurrence.weekdays || [])
            .map(day => weekdayNames[day])
            .join("・");

        return `毎週 ${days}`;
      }

      if (item.recurrence.type === "monthly") {
        return `毎月${item.recurrence.monthDay}日`;
      }

      return "";
    }

    function createInitialEvents() {
      const today = todayAtNoon();

      return [
        {
          id: makeId(),
          title: "今日の予定",
          date: dateToText(today),
          type: "schedule"
        },
        {
          id: makeId(),
          title: "今月の予定",
          date: dateToText(addDays(today, 14)),
          type: "milestone"
        },
        {
          id: makeId(),
          title: "1年後の目標",
          date: dateToText(addDays(today, 300)),
          type: "milestone"
        },
        {
          id: makeId(),
          title: "6年後の目標",
          date: dateToText(addDays(today, 365 * 6)),
          type: "goal"
        },
        {
          id: makeId(),
          title: "長期目標",
          date: dateToText(addDays(today, 365 * 12)),
          type: "goal"
        }
      ];
    }

    function normalizeItem(item) {
      return {
        ...item,

        recurrence:
          item.recurrence ||
          {
            type: "none"
          },

        completedDates:
          item.completedDates || []
      };
    }

    function loadEvents() {
      const saved =
        localStorage.getItem(STORAGE_KEY);

      if (saved) {
        try {
          return JSON
            .parse(saved)
            .map(normalizeItem);
        } catch (error) {
          console.warn(
            "保存データを読み込めませんでした",
            error
          );
        }
      }

      const initialEvents =
        createInitialEvents().map(normalizeItem);

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(initialEvents)
      );

      return initialEvents;
    }

    let timelineEvents = loadEvents();

    function saveEvents() {
      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(timelineEvents)
      );
    }

    function lastDayOfMonth(year, month) {
      return new Date(
        year,
        month + 1,
        0,
        12
      ).getDate();
    }

    function generateOccurrences(
      item,
      fromDate,
      toDate
    ) {
      const start =
        dateFromText(item.date);

      const begin =
        start > fromDate
          ? start
          : fromDate;

      const output = [];
      const type = item.recurrence.type;

      if (
        type === "daily" ||
        type === "weekly"
      ) {
        for (
          let cursor = new Date(begin);
          cursor <= toDate;
          cursor = addDays(cursor, 1)
        ) {
          const correctWeekday =
            (item.recurrence.weekdays || [])
              .includes(cursor.getDay());

          if (
            type === "daily" ||
            correctWeekday
          ) {
            output.push({
              ...item,
              occurrenceDate:
                dateToText(cursor),
              isOccurrence: true
            });
          }
        }
      }

      if (type === "monthly") {
        let cursor = new Date(
          begin.getFullYear(),
          begin.getMonth(),
          1,
          12
        );

        while (cursor <= toDate) {
          const chosenDay = Math.min(
            Number(item.recurrence.monthDay),

            lastDayOfMonth(
              cursor.getFullYear(),
              cursor.getMonth()
            )
          );

          const occurrence = new Date(
            cursor.getFullYear(),
            cursor.getMonth(),
            chosenDay,
            12
          );

          if (
            occurrence >= begin &&
            occurrence >= start &&
            occurrence <= toDate
          ) {
            output.push({
              ...item,
              occurrenceDate:
                dateToText(occurrence),
              isOccurrence: true
            });
          }

          cursor = new Date(
            cursor.getFullYear(),
            cursor.getMonth() + 1,
            1,
            12
          );
        }
      }

      return output;
    }

    function visibleItemsForRange(
      selectedRange
    ) {
      const today = todayAtNoon();

      const endDate =
        addDays(today, selectedRange.days);

      const output = [];

      timelineEvents.forEach(item => {
        const repeat =
          item.type === "todo" &&
          item.recurrence.type !== "none";

        if (
          repeat &&
          selectedRange.days <= 31
        ) {
          output.push(
            ...generateOccurrences(
              item,
              today,
              endDate
            )
          );

          return;
        }

        if (repeat) {
          const start =
            dateFromText(item.date);

          if (start <= endDate) {
            output.push({
              ...item,

              occurrenceDate:
                dateToText(
                  start < today
                    ? today
                    : start
                ),

              isSummary: true
            });
          }

          return;
        }

        const itemDate =
          dateFromText(item.date);

        if (
          itemDate >= today &&
          itemDate <= endDate
        ) {
          output.push({
            ...item,
            occurrenceDate: item.date
          });
        }
      });

      return output.sort((a, b) => {
        return (
          dateFromText(a.occurrenceDate) -
          dateFromText(b.occurrenceDate)
        );
      });
    }

    function isCompleted(item) {
      return (
        item.completedDates || []
      ).includes(item.occurrenceDate);
    }

    function updateTodayCount() {
      const today = todayAtNoon();

      const todayText =
        dateToText(today);

      let count = 0;

      timelineEvents
        .filter(item => item.type === "todo")
        .forEach(item => {
          if (
            item.recurrence.type === "none"
          ) {
            const unfinished =
              !(item.completedDates || [])
                .includes(todayText);

            if (
              item.date === todayText &&
              unfinished
            ) {
              count++;
            }
          } else {
            const occurs =
              generateOccurrences(
                item,
                today,
                today
              ).some(item => {
                return (
                  item.occurrenceDate ===
                  todayText
                );
              });

            const unfinished =
              !(item.completedDates || [])
                .includes(todayText);

            if (occurs && unfinished) {
              count++;
            }
          }
        });

      todoCount.textContent =
        `今日の未完了TO DO：${count}件`;
    }

    function drawTimeline() {
      const selectedRange =
        ranges[Number(zoom.value)];

      const today =
        todayAtNoon();

      const endDate =
        addDays(
          today,
          selectedRange.days
        );

      const visibleEvents =
        visibleItemsForRange(selectedRange);

      rangeText.textContent =
        selectedRange.label;

      axisStart.textContent =
        formatDate(today);

      axisEnd.textContent =
        formatDate(endDate);

      updateTodayCount();

      if (visibleEvents.length === 0) {
        eventsArea.innerHTML = `
          <div class="empty-message">
            この期間に登録された項目はありません
          </div>
        `;

        return;
      }

      eventsArea.innerHTML =
        visibleEvents
          .map((item, index) => {
            const itemDate =
              dateFromText(
                item.occurrenceDate
              );

            const difference =
              Math.max(
                0,
                Math.round(
                  (itemDate - today) / DAY
                )
              );

            const percentage =
              Math.max(
                5,
                Math.min(
                  95,

                  5 +
                  (
                    difference /
                    selectedRange.days
                  ) *
                  90
                )
              );

            const lane =
              index % 2 === 0
                ? "above"
                : "below";

            const completed =
              item.type === "todo" &&
              !item.isSummary &&
              isCompleted(item);

            const repeat =
              recurrenceLabel(item);

            const completeButton =
              item.type === "todo" &&
              !item.isSummary

                ? `
                  <button
                    class="complete-button"
                    type="button"
                    data-action="complete"
                    data-id="${item.id}"
                    data-date="${item.occurrenceDate}"
                    aria-label="完了切り替え"
                  >
                    ${completed ? "✓" : ""}
                  </button>
                `

                : "";

            return `
              <div
                class="
                  event
                  ${lane}
                  ${item.type}
                  ${completed ? "completed" : ""}
                "
                style="left: ${percentage}%"
              >
                <div class="point"></div>

                <div class="event-card">
                  ${completeButton}

                  <button
                    class="delete-button"
                    type="button"
                    data-action="delete"
                    data-id="${item.id}"
                    aria-label="削除"
                  >
                    ×
                  </button>

                  <div class="event-title">
                    ${escapeText(item.title)}
                  </div>

                  <div class="event-date">
                    ${formatDate(itemDate)}
                  </div>

                  ${
                    repeat
                      ? `
                        <div class="repeat-label">
                          ${repeat}
                          ${
                            item.isSummary
                              ? "（まとめ表示）"
                              : ""
                          }
                        </div>
                      `
                      : ""
                  }
                </div>
              </div>
            `;
          })
          .join("");
    }

    eventsArea.addEventListener(
      "click",
      event => {
        const button =
          event.target.closest(
            "button[data-action]"
          );

        if (!button) {
          return;
        }

        event.stopPropagation();

        const item =
          timelineEvents.find(entry => {
            return (
              entry.id ===
              button.dataset.id
            );
          });

        if (!item) {
          return;
        }

        if (
          button.dataset.action ===
          "complete"
        ) {
          const date =
            button.dataset.date;

          item.completedDates =
            item.completedDates || [];

          if (
            item.completedDates
              .includes(date)
          ) {
            item.completedDates =
              item.completedDates
                .filter(savedDate => {
                  return savedDate !== date;
                });
          } else {
            item.completedDates = [
              ...item.completedDates,
              date
            ];
          }

          saveEvents();
          drawTimeline();
        }

        if (
          button.dataset.action ===
          "delete"
        ) {
          const repeating =
            item.type === "todo" &&
            item.recurrence.type !== "none";

          const message =
            repeating

              ? "この繰り返しTO DO全体を削除しますか？"

              : "この項目を削除しますか？";

          if (!window.confirm(message)) {
            return;
          }

          timelineEvents =
            timelineEvents.filter(entry => {
              return entry.id !== item.id;
            });

          saveEvents();
          drawTimeline();
        }
      }
    );

    function updateRepeatControls() {
      repeatBox.classList.toggle(
        "open",
        eventType.value === "todo"
      );

      weeklyOptions.classList.toggle(
        "open",
        repeatType.value === "weekly"
      );

      monthlyOptions.classList.toggle(
        "open",
        repeatType.value === "monthly"
      );
    }

    eventType.addEventListener(
      "change",
      updateRepeatControls
    );

    repeatType.addEventListener(
      "change",
      updateRepeatControls
    );

    openFormButton.addEventListener(
      "click",
      () => {
        formPanel.classList.add("open");

        const today =
          todayAtNoon();

        eventDate.value =
          dateToText(today);

        monthDay.value =
          today.getDate();

        document
          .querySelectorAll(
            'input[name="weekday"]'
          )
          .forEach(box => {
            box.checked =
              Number(box.value) ===
              today.getDay();
          });

        updateRepeatControls();

        eventTitle.focus();
      }
    );

    cancelButton.addEventListener(
      "click",
      () => {
        formPanel.classList.remove("open");

        eventForm.reset();

        updateRepeatControls();
      }
    );

    eventForm.addEventListener(
      "submit",
      event => {
        event.preventDefault();

        const title =
          eventTitle.value.trim();

        const selectedDate =
          dateFromText(eventDate.value);

        const today =
          todayAtNoon();

        const difference =
          Math.round(
            (selectedDate - today) / DAY
          );

        if (difference < 0) {
          window.alert(
            "現在より後の日付を選んでください"
          );

          return;
        }

        let recurrence = {
          type: "none"
        };

        if (
          eventType.value === "todo"
        ) {
          recurrence = {
            type: repeatType.value
          };

          if (
            repeatType.value === "weekly"
          ) {
            recurrence.weekdays =
              Array.from(
                document.querySelectorAll(
                  'input[name="weekday"]:checked'
                )
              )
              .map(box => {
                return Number(box.value);
              });

            if (
              recurrence.weekdays.length === 0
            ) {
              window.alert(
                "曜日を1つ以上選んでください"
              );

              return;
            }
          }

          if (
            repeatType.value === "monthly"
          ) {
            recurrence.monthDay =
              Number(monthDay.value);
          }
        }

        timelineEvents.push({
          id: makeId(),
          title: title,
          date: eventDate.value,
          type: eventType.value,
          recurrence: recurrence,
          completedDates: []
        });

        saveEvents();

        if (difference <= 1) {
          zoom.value = 0;
        } else if (difference <= 31) {
          zoom.value = 1;
        } else if (difference <= 365) {
          zoom.value = 2;
        } else if (difference <= 3650) {
          zoom.value = 3;
        } else {
          zoom.value = 4;
        }

        eventForm.reset();

        formPanel.classList.remove("open");

        updateRepeatControls();

        drawTimeline();
      }
    );

    zoom.addEventListener(
      "input",
      drawTimeline
    );

    function changeZoom(newValue) {
      zoom.value =
        Math.max(
          0,
          Math.min(4, newValue)
        );

      drawTimeline();
    }

    let gestureStartZoom = 2;

    timeline.addEventListener(
      "gesturestart",
      event => {
        event.preventDefault();

        gestureStartZoom =
          Number(zoom.value);
      },
      {
        passive: false
      }
    );

    timeline.addEventListener(
      "gesturechange",
      event => {
        event.preventDefault();

        const amount =
          Math.log(event.scale) /
          Math.log(1.4);

        changeZoom(
          Math.round(
            gestureStartZoom - amount
          )
        );
      },
      {
        passive: false
      }
    );

    let wheelAmount = 0;

    timeline.addEventListener(
      "wheel",
      event => {
        if (!event.ctrlKey) {
          return;
        }

        event.preventDefault();

        wheelAmount += event.deltaY;

        if (wheelAmount > 35) {
          changeZoom(
            Number(zoom.value) + 1
          );

          wheelAmount = 0;
        }

        if (wheelAmount < -35) {
          changeZoom(
            Number(zoom.value) - 1
          );

          wheelAmount = 0;
        }
      },
      {
        passive: false
      }
    );

    const fingers = new Map();

    let startingDistance = 0;
    let startingZoom = 2;

    function getDistance() {
      const points =
        Array.from(fingers.values());

      return Math.hypot(
        points[0].x - points[1].x,
        points[0].y - points[1].y
      );
    }

    timeline.addEventListener(
      "pointerdown",
      event => {
        fingers.set(
          event.pointerId,
          {
            x: event.clientX,
            y: event.clientY
          }
        );

        if (fingers.size === 2) {
          startingDistance =
            getDistance();

          startingZoom =
            Number(zoom.value);
        }
      }
    );

    timeline.addEventListener(
      "pointermove",
      event => {
        if (
          !fingers.has(event.pointerId)
        ) {
          return;
        }

        fingers.set(
          event.pointerId,
          {
            x: event.clientX,
            y: event.clientY
          }
        );

        if (
          fingers.size === 2 &&
          startingDistance > 0
        ) {
          const scale =
            getDistance() /
            startingDistance;

          const amount =
            Math.log(scale) /
            Math.log(1.4);

          changeZoom(
            Math.round(
              startingZoom - amount
            )
          );
        }
      }
    );

    function removeFinger(event) {
      fingers.delete(event.pointerId);
    }

    timeline.addEventListener(
      "pointerup",
      removeFinger
    );

    timeline.addEventListener(
      "pointercancel",
      removeFinger
    );

    eventDate.min =
      dateToText(todayAtNoon());

    updateRepeatControls();

    drawTimeline();
  </script>
</body>
</html>
