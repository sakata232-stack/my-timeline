<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>My Timeline</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --blue: #007aff;
      --orange: #ff9500;
      --purple: #af52de;
      --green: #34c759;
      --ink: #1d1d1f;
      --muted: #727277;
      --line: #d2d2d7;
      --surface: #ffffff;
      --background: #f5f5f7;
    }

    body {
      margin: 0;
      padding: 30px;
      background: var(--background);
      color: var(--ink);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      max-width: 1000px;
      margin: auto;
    }

    .header {
      display: flex;
      gap: 18px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0 0 4px;
    }

    .todo-count {
      color: var(--muted);
    }

    .add-button {
      padding: 12px 18px;
      border: 0;
      border-radius: 12px;
      background: var(--blue);
      color: white;
      font-weight: 600;
    }

    .backup-bar {
      display: flex;
      gap: 9px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .backup-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 9px 13px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: white;
      color: #333;
      font-weight: 600;
    }

    .backup-input {
      display: none;
    }

    .backup-status {
      color: var(--muted);
      font-size: 12px;
    }

    .form-panel {
      display: none;
      padding: 22px;
      margin-bottom: 25px;
      background: var(--surface);
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
    }

    .form-panel.open {
      display: block;
    }

    .form-title {
      margin: 0 0 18px;
      font-size: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 15px;
    }

    .field {
      min-width: 0;
    }

    .field-label {
      display: block;
      margin-bottom: 7px;
      color: #666;
      font-size: 13px;
    }

    input[type="text"],
    input[type="date"],
    input[type="number"],
    select {
      width: 100%;
      height: 44px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: white;
      color: var(--ink);
    }

    .repeat-box {
      display: none;
      padding: 16px;
      margin-top: 16px;
      background: var(--background);
      border-radius: 12px;
    }

    .repeat-box.open {
      display: block;
    }

    .repeat-options {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 15px;
      align-items: end;
    }

    .weekly-options,
    .monthly-options {
      display: none;
    }

    .weekly-options.open,
    .monthly-options.open {
      display: block;
    }

    .weekday-row {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .weekday {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: white;
    }

    .weekday input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .weekday:has(input:checked) {
      border-color: var(--blue);
      background: var(--blue);
      color: white;
    }

    .form-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 18px;
    }

    .cancel-button,
    .save-button {
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 600;
    }

    .cancel-button {
      border: 1px solid var(--line);
      background: white;
    }

    .save-button {
      border: 0;
      background: var(--blue);
      color: white;
    }

    .range {
      margin-bottom: 18px;
      color: #555;
      font-size: 18px;
      font-weight: 600;
    }

    #zoom {
      width: 100%;
      margin-bottom: 30px;
      accent-color: var(--blue);
    }

    .zoom-labels {
      display: flex;
      justify-content: space-between;
      margin-top: -22px;
      margin-bottom: 28px;
      color: #888;
      font-size: 12px;
    }

    .legend {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 12px;
    }

    .legend span::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 5px;
      border-radius: 50%;
    }

    .legend .schedule::before {
      background: var(--blue);
    }

    .legend .milestone::before {
      background: var(--orange);
    }

    .legend .goal::before {
      background: var(--purple);
    }

    .legend .todo::before {
      background: var(--green);
    }

    .timeline {
      position: relative;
      min-height: 350px;
      overflow: hidden;
      background: var(--surface);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      cursor: grab;
      touch-action: none;
      user-select: none;
    }

    .timeline.dragging { cursor: grabbing; }
    .timeline-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
    .timeline-toolbar .range { margin: 0; }
    #returnTodayButton { flex-shrink: 0; }

    .timeline-line {
      position: absolute;
      top: 155px;
      right: 35px;
      left: 35px;
      height: 3px;
      background: var(--line);
    }

    .axis-start,
    .axis-end {
      position: absolute;
      top: 305px;
      color: #888;
      font-size: 13px;
    }

    .axis-start {
      left: 25px;
    }

    .axis-end {
      right: 25px;
    }

    .event {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 0;
    }

    .point {
      position: absolute;
      top: 146px;
      left: -9px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      box-shadow: 0 0 0 6px rgba(0, 122, 255, 0.12);
    }

    .event-card {
      position: absolute;
      left: -68px;
      width: 136px;
      min-height: 67px;
      padding: 10px 8px;
      background: var(--background);
      border-radius: 12px;
      text-align: center;
    }

    .event.above .event-card {
      top: 27px;
    }

    .event.below .event-card {
      top: 188px;
    }

    .event-title {
      overflow: hidden;
      margin-bottom: 5px;
      font-size: 14px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .event-date,
    .repeat-label {
      color: #777;
      font-size: 12px;
    }

    .repeat-label {
      margin-top: 3px;
      color: var(--green);
    }

    .event.schedule .point {
      background: var(--blue);
    }

    .event.milestone .point {
      background: var(--orange);
    }

    .event.goal .point {
      background: var(--purple);
    }

    .event.todo .point {
      background: var(--green);
    }

    .event.completed .event-card {
      opacity: 0.48;
    }

    .event.completed .event-title {
      text-decoration: line-through;
    }

    .complete-button {
      position: absolute;
      top: -8px;
      left: -8px;
      width: 25px;
      height: 25px;
      padding: 0;
      border: 2px solid var(--green);
      border-radius: 50%;
      background: white;
      color: var(--green);
      font-size: 15px;
      font-weight: 700;
      line-height: 21px;
    }

    .completed .complete-button {
      background: var(--green);
      color: white;
    }

    .delete-button {
      position: absolute;
      top: -7px;
      right: -7px;
      width: 22px;
      height: 22px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: #d8d8dc;
      color: #555;
      line-height: 22px;
    }

    .empty-message {
      position: absolute;
      top: 110px;
      right: 20px;
      left: 20px;
      color: #888;
      text-align: center;
    }

    .hint {
      margin-top: 18px;
      color: #777;
      text-align: center;
    }

    .storage-note {
      margin-top: 8px;
      color: #999;
      font-size: 12px;
      text-align: center;
    }

    body { padding-bottom: calc(100px + env(safe-area-inset-bottom)); }
    [hidden] { display: none !important; }
    button, .backup-button, .weekday { min-height: 44px; }
    .weekday { min-width: 44px; }
    button:focus-visible, input:focus-visible, select:focus-visible,
    .weekday:has(input:focus-visible) { outline: 3px solid var(--blue); outline-offset: 3px; }
    .bottom-tabs {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px calc(10px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      background: var(--surface);
    }
    .tab-button {
      flex: 1;
      max-width: 300px;
      min-height: 48px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: var(--muted);
      font-weight: 600;
    }
    .tab-button[aria-selected="true"] { background: #eaf3ff; color: var(--blue); }
    .screen-title { margin: 0 0 16px; font-size: 22px; }
    .todo-section { margin-bottom: 20px; }
    .todo-section h3 { margin: 0 0 10px; font-size: 17px; }
    .todo-section h3 span { margin-left: 8px; color: var(--muted); font-size: 13px; }
    .todo-section.overdue h3 { color: #c42b25; }
    .todo-list { list-style: none; margin: 0; padding: 0; }
    .todo-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      margin-bottom: 8px;
      border: 1px solid #e8e8ed;
      border-radius: 14px;
      background: var(--surface);
    }
    .todo-toggle {
      flex: 0 0 44px;
      width: 44px;
      height: 44px;
      border: 2px solid var(--green);
      border-radius: 50%;
      color: #167b30;
      background: white;
      font-size: 22px;
    }
    .todo-row.completed .todo-toggle { background: var(--green); color: white; }
    .todo-row.completed .todo-title { text-decoration: line-through; color: var(--muted); }
    .todo-content { flex: 1; min-width: 0; }
    .todo-title { font-weight: 600; overflow-wrap: anywhere; }
    .todo-meta, .todo-empty, .todo-help { color: var(--muted); font-size: 13px; line-height: 1.6; }
    .todo-meta { margin-top: 4px; }
    .todo-delete { flex-shrink: 0; border: 0; border-radius: 8px; background: var(--background); color: #666; padding: 8px; }
    .add-button { flex-shrink: 0; }

    @media (max-width: 650px) {
      body {
        padding: 18px 14px calc(100px + env(safe-area-inset-bottom));
      }

      .header {
        align-items: flex-start;
        gap: 10px;
      }

      h1 { font-size: 26px; }
      .todo-count { font-size: 13px; }
      .add-button { padding: 12px 14px; }

      .form-grid,
      .repeat-options {
        grid-template-columns: 1fr;
      }

      .event-card {
        left: -55px;
        width: 110px;
      }

      .event-title {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <div class="header">
      <div>
        <h1>My Timeline</h1>

        <div class="todo-count" id="todoCount">
          今日の未完了TO DO：0件
        </div>
      </div>

      <button
        class="add-button"
        id="openFormButton"
        type="button"
      >
        ＋ 追加
      </button>
    </div>

    <section class="backup-bar" aria-label="データ保護">
      <button
        class="backup-button"
        id="exportButton"
        type="button"
      >
        バックアップ保存
      </button>

      <label
        class="backup-button"
        for="importInput"
      >
        バックアップ読込
      </label>

      <input
        class="backup-input"
        id="importInput"
        type="file"
        accept="application/json,.json"
      >

      <button
        class="backup-button"
        id="undoButton"
        type="button"
      >
        直前の状態に戻す
      </button>

      <span
        class="backup-status"
        id="backupStatus"
      ></span>
    </section>

    <section class="form-panel" id="formPanel">
      <h2 class="form-title">
        新しい予定・目標・TO DO
      </h2>

      <form id="eventForm">
        <div class="form-grid">
          <div class="field">
            <label class="field-label" for="eventTitle">
              内容
            </label>

            <input
              id="eventTitle"
              type="text"
              placeholder="例：在庫を確認する"
              required
            >
          </div>

          <div class="field">
            <label class="field-label" for="eventDate">
              開始日・期限
            </label>

            <input
              id="eventDate"
              type="date"
              required
            >
          </div>

          <div class="field">
            <label class="field-label" for="eventType">
              種類
            </label>

            <select id="eventType">
              <option value="schedule">予定</option>
              <option value="milestone">節目</option>
              <option value="goal">目標</option>
              <option value="todo">TO DO</option>
            </select>
          </div>
        </div>

        <div class="repeat-box" id="repeatBox">
          <div class="repeat-options">
            <div class="field">
              <label class="field-label" for="repeatType">
                繰り返し
              </label>

              <select id="repeatType">
                <option value="none">なし</option>
                <option value="daily">毎日</option>
                <option value="weekly">毎週</option>
                <option value="monthly">毎月</option>
              </select>
            </div>

            <div class="weekly-options" id="weeklyOptions">
              <label class="field-label">
                曜日（複数選択可）
              </label>

              <div class="weekday-row">
                <label class="weekday">
                  <input type="checkbox" name="weekday" value="1">月
                </label>

                <label class="weekday">
                  <input type="checkbox" name="weekday" value="2">火
                </label>

                <label class="weekday">
                  <input type="checkbox" name="weekday" value="3">水
                </label>

                <label class="weekday">
                  <input type="checkbox" name="weekday" value="4">木
                </label>

                <label class="weekday">
                  <input type="checkbox" name="weekday" value="5">金
                </label>

                <label class="weekday">
                  <input type="checkbox" name="weekday" value="6">土
                </label>

                <label class="weekday">
                  <input type="checkbox" name="weekday" value="0">日
                </label>
              </div>
            </div>

            <div class="monthly-options" id="monthlyOptions">
              <label class="field-label" for="monthDay">
                毎月の日付（1〜31）
              </label>

              <input
                id="monthDay"
                type="number"
                min="1"
                max="31"
                value="1"
              >
            </div>
          </div>
        </div>

        <div class="form-actions">
          <button
            class="cancel-button"
            id="cancelButton"
            type="button"
          >
            キャンセル
          </button>

          <button class="save-button" type="submit">
            登録する
          </button>
        </div>
      </form>
    </section>

    <section id="todayScreen" role="tabpanel" aria-labelledby="todayTab">
      <h2 class="screen-title">今日</h2>
      <p class="todo-help">繰り返しには未完了分と次回分を表示します。チェックで日付ごとに完了を切り替えられます。</p>
      <div id="todoLists"></div>
    </section>

    <section id="timelineScreen" role="tabpanel" aria-labelledby="timelineTab" hidden>
    <h2 class="screen-title">タイムライン</h2>
    <div class="timeline-toolbar">
      <div class="range" id="rangeText">今後1年間</div>
      <button class="backup-button" id="returnTodayButton" type="button">今日へ戻る</button>
    </div>

    <input
      id="zoom"
      type="range"
      min="0"
      max="4"
      value="2"
      aria-label="タイムラインの表示期間"
      step="any"
    >

    <div class="zoom-labels">
      <span>今日</span>
      <span>1か月</span>
      <span>1年</span>
      <span>10年</span>
      <span>30年</span>
    </div>

    <div class="legend">
      <span class="schedule">予定</span>
      <span class="milestone">節目</span>
      <span class="goal">目標</span>
    </div>

    <section class="timeline" id="timeline">
      <div class="timeline-line"></div>
      <div id="events"></div>
      <div class="axis-start" id="axisStart"></div>
      <div class="axis-end" id="axisEnd"></div>
    </section>

    <div class="hint">
      左右にドラッグして過去・未来へ移動。2本指でピンチすると表示期間が変わります
    </div>

    </section>

    <div class="storage-note">
      登録内容と完了履歴は、このブラウザ内に保存されます
    </div>
  </main>

  <nav class="bottom-tabs" role="tablist" aria-label="画面切り替え">
    <button class="tab-button" id="todayTab" type="button" role="tab" aria-selected="true" aria-controls="todayScreen">今日</button>
    <button class="tab-button" id="timelineTab" type="button" role="tab" aria-selected="false" aria-controls="timelineScreen" tabindex="-1">タイムライン</button>
  </nav>

  <script>
    const DAY = 24 * 60 * 60 * 1000;

    const STORAGE_KEY =
      "my-timeline-events";

    const BACKUP_KEY =
      "my-timeline-previous-events";

    const ranges = [
      {
        label: "今日の予定",
        days: 1
      },
      {
        label: "今後1か月",
        days: 31
      },
      {
        label: "今後1年間",
        days: 365
      },
      {
        label: "今後10年間",
        days: 3650
      },
      {
        label: "今後30年間",
        days: 10950
      }
    ];

    const weekdayNames = [
      "日",
      "月",
      "火",
      "水",
      "木",
      "金",
      "土"
    ];

    const zoom =
      document.getElementById("zoom");

    const rangeText =
      document.getElementById("rangeText");

    const timeline =
      document.getElementById("timeline");

    const eventsArea =
      document.getElementById("events");

    const axisStart =
      document.getElementById("axisStart");

    const axisEnd =
      document.getElementById("axisEnd");

    const todoCount =
      document.getElementById("todoCount");

    const formPanel =
      document.getElementById("formPanel");

    const eventForm =
      document.getElementById("eventForm");

    const eventTitle =
      document.getElementById("eventTitle");

    const eventDate =
      document.getElementById("eventDate");

    const eventType =
      document.getElementById("eventType");

    const repeatBox =
      document.getElementById("repeatBox");

    const repeatType =
      document.getElementById("repeatType");

    const weeklyOptions =
      document.getElementById("weeklyOptions");

    const monthlyOptions =
      document.getElementById("monthlyOptions");

    const monthDay =
      document.getElementById("monthDay");

    const openFormButton =
      document.getElementById("openFormButton");

    const cancelButton =
      document.getElementById("cancelButton");

    const exportButton =
      document.getElementById("exportButton");

    const importInput =
      document.getElementById("importInput");

    const undoButton =
      document.getElementById("undoButton");

    const backupStatus =
      document.getElementById("backupStatus");

    const todayScreen = document.getElementById("todayScreen");
    const timelineScreen = document.getElementById("timelineScreen");
    const todoLists = document.getElementById("todoLists");
    const todayTab = document.getElementById("todayTab");
    const timelineTab = document.getElementById("timelineTab");
    let activeScreen = "today";
    // View state only; stored events and TO DO dates remain unchanged.
    let timelineStart = todayAtNoon().getTime();
    let timelineFrame = null;
    let displayDays = daysForZoom(Number(zoom.value));

    // Interpolate logarithmically between the existing slider landmarks.
    function daysForZoom(value) {
      const position = Math.max(0, Math.min(4, value));
      const index = Math.min(3, Math.floor(position));
      const low = ranges[index].days;
      const high = ranges[index + 1].days;
      return low * Math.exp(Math.log(high / low) * (position - index));
    }

    function zoomForDays(days) {
      const bounded = Math.max(1, Math.min(ranges[4].days, days));
      const index = Math.min(3, ranges.findIndex(range => range.days >= bounded) - 1);
      const lower = Math.max(0, index);
      return lower + Math.log(bounded / ranges[lower].days) /
        Math.log(ranges[lower + 1].days / ranges[lower].days);
    }

    function durationLabel(days) {
      if (days < 30) return `${Math.max(1, Math.round(days))}日間`;
      if (days < 365) return `${Number((days / (365 / 12)).toFixed(1))}か月`;
      return `${Number((days / 365).toFixed(1))}年間`;
    }

    function timelineFraction(clientX) {
      const rect = timeline.getBoundingClientRect();
      const x = Number.isFinite(clientX) ? clientX : rect.left + rect.width / 2;
      return (x - rect.left - rect.width * 0.05) / Math.max(1, rect.width * 0.9);
    }

    function requestTimelineDraw() {
      if (timelineFrame !== null) return;
      timelineFrame = requestAnimationFrame(() => {
        timelineFrame = null;
        renderTimeline();
      });
    }

    function selectScreen(screen) {
      resetTimelineGesture();
      activeScreen = screen;
      const isToday = screen === "today";
      todayScreen.hidden = !isToday;
      timelineScreen.hidden = isToday;
      todayTab.setAttribute("aria-selected", String(isToday));
      timelineTab.setAttribute("aria-selected", String(!isToday));
      todayTab.tabIndex = isToday ? 0 : -1;
      timelineTab.tabIndex = isToday ? -1 : 0;
      drawTimeline();
    }

    [todayTab, timelineTab].forEach((tab, index) => {
      tab.addEventListener("click", () => selectScreen(index === 0 ? "today" : "timeline"));
      tab.addEventListener("keydown", event => {
        if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
        event.preventDefault();
        const next = event.key === "Home" ? 0 : event.key === "End" ? 1 : 1 - index;
        selectScreen(next === 0 ? "today" : "timeline");
        [todayTab, timelineTab][next].focus();
      });
    });

    function makeId() {
      if (crypto.randomUUID) {
        return crypto.randomUUID();
      }

      return Date.now() + "-" + Math.random();
    }

    function todayAtNoon() {
      const date = new Date();

      date.setHours(12, 0, 0, 0);

      return date;
    }

    function dateFromText(text) {
      return new Date(text + "T12:00:00");
    }

    function dateToText(date) {
      const year = date.getFullYear();

      const month =
        String(date.getMonth() + 1)
          .padStart(2, "0");

      const day =
        String(date.getDate())
          .padStart(2, "0");

      return `${year}-${month}-${day}`;
    }

    function addDays(date, numberOfDays) {
      const newDate = new Date(date);

      newDate.setDate(
        newDate.getDate() + numberOfDays
      );

      return newDate;
    }

    function formatDate(date) {
      return new Intl.DateTimeFormat(
        "ja-JP",
        {
          year: "numeric",
          month: "short",
          day: "numeric"
        }
      ).format(date);
    }

    function escapeText(text) {
      const element =
        document.createElement("div");

      element.textContent = text;

      return element.innerHTML;
    }

    function recurrenceLabel(item) {
      if (
        !item.recurrence ||
        item.recurrence.type === "none"
      ) {
        return "";
      }

      if (
        item.recurrence.type === "daily"
      ) {
        return "毎日";
      }

      if (
        item.recurrence.type === "weekly"
      ) {
        const days =
          (item.recurrence.weekdays || [])
            .map(day => weekdayNames[day])
            .join("・");

        return `毎週 ${days}`;
      }

      if (
        item.recurrence.type === "monthly"
      ) {
        return `毎月${item.recurrence.monthDay}日`;
      }

      return "";
    }

    function removeInitialSamples(items) {
      // Old samples had no marker. Match the complete original set and date
      // offsets so a user-created item with the same title is not removed alone.
      const samples = [
        ["今日の予定", "schedule", 0],
        ["今月の予定", "milestone", 14],
        ["1年後の目標", "milestone", 300],
        ["6年後の目標", "goal", 365 * 6],
        ["長期目標", "goal", 365 * 12]
      ];
      const removed = new Set();
      items.filter(item => item.title === samples[0][0] && item.type === "schedule")
        .forEach(first => {
          const start = dateFromText(first.date);
          if (Number.isNaN(start.getTime())) return;
          const matches = samples.map(([title, type, offset]) => items.find(item =>
            !removed.has(item) && item.title === title && item.type === type &&
            item.date === dateToText(addDays(start, offset)) &&
            item.recurrence.type === "none" && item.completedDates.length === 0
          ));
          if (matches.every(Boolean)) matches.forEach(item => removed.add(item));
        });
      return items.filter(item => !removed.has(item));
    }

    function normalizeItem(item) {
      return {
        ...item,

        recurrence:
          item.recurrence ||
          {
            type: "none"
          },

        completedDates:
          item.completedDates || []
      };
    }

    function loadEvents() {
      const saved =
        localStorage.getItem(STORAGE_KEY);

      if (saved) {
        try {
          const items = JSON.parse(saved).map(normalizeItem);
          const cleaned = removeInitialSamples(items);
          if (cleaned.length !== items.length) {
            localStorage.setItem(BACKUP_KEY, saved);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(cleaned));
          }
          return cleaned;
        } catch (error) {
          console.warn(
            "保存データを読み込めませんでした",
            error
          );
        }
      }

      const initialEvents = [];

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(initialEvents)
      );

      return initialEvents;
    }

    let timelineEvents = loadEvents();

    function saveEvents() {
      const currentSaved =
        localStorage.getItem(STORAGE_KEY);

      if (currentSaved) {
        localStorage.setItem(
          BACKUP_KEY,
          currentSaved
        );
      }

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(timelineEvents)
      );
    }

    function showBackupStatus(message) {
      backupStatus.textContent = message;

      window.setTimeout(() => {
        if (
          backupStatus.textContent === message
        ) {
          backupStatus.textContent = "";
        }
      }, 5000);
    }

    function validImportedEvents(value) {
      return (
        Array.isArray(value) &&
        value.every(item => {
          return (
            item &&
            typeof item.title === "string" &&
            typeof item.date === "string" &&
            typeof item.type === "string"
          );
        })
      );
    }

    exportButton.addEventListener(
      "click",
      () => {
        const payload = {
          app: "my-timeline",
          version: 1,
          exportedAt:
            new Date().toISOString(),
          events: timelineEvents
        };

        const backupText =
          JSON.stringify(
            payload,
            null,
            2
          );

        const blob = new Blob(
          [backupText],
          {
            type: "application/json"
          }
        );

        const url =
          URL.createObjectURL(blob);

        const link =
          document.createElement("a");

        link.href = url;

        link.download =
          `my-timeline-backup-${
            dateToText(todayAtNoon())
          }.json`;

        document.body.appendChild(link);

        link.click();
        link.remove();

        window.setTimeout(() => {
          URL.revokeObjectURL(url);
        }, 1000);

        showBackupStatus(
          "バックアップを書き出しました"
        );
      }
    );

    importInput.addEventListener(
      "change",
      async event => {
        const file =
          event.target.files &&
          event.target.files[0];

        if (!file) {
          return;
        }

        try {
          const fileText =
            await file.text();

          const parsed =
            JSON.parse(fileText);

          const importedEvents =
            Array.isArray(parsed)
              ? parsed
              : parsed.events;

          if (
            !validImportedEvents(
              importedEvents
            )
          ) {
            throw new Error(
              "形式が正しくありません"
            );
          }

          const confirmed =
            window.confirm(
              `${importedEvents.length}件のデータを読み込み、現在の内容を置き換えますか？`
            );

          if (!confirmed) {
            importInput.value = "";

          timelineEvents =
            importedEvents
              .map(normalizeItem);

        } catch (error) {
          window.alert(
            "このファイルは読み込めません。My Timelineのバックアップを選んでください。"

    undoButton.addEventListener(
      "click",
      () => {
        const previousSaved =
          localStorage.getItem(BACKUP_KEY);

        if (!previousSaved) {
          window.alert(

          return;
        }

            );

          );

            localStorage.setItem(

            );

          timelineEvents =

              .map(normalizeItem);

            "直前の状態へ戻しました"

        } catch (error) {

    function lastDayOfMonth(
      year,
      month
    ) {
      return new Date(
        year,
        month + 1,
        0,
        12
      ).getDate();
    }

    function generateOccurrences(
      item,
      fromDate,
      toDate
    ) {
      const start =
        dateFromText(item.date);

      const begin =
        start > fromDate
          ? start
          : fromDate;

      const output = [];
      const type = item.recurrence.type;

      if (
        type === "daily" ||
        type === "weekly"
      ) {
        for (
          let cursor = new Date(begin);
          cursor <= toDate;
          cursor = addDays(cursor, 1)
        ) {
          const correctWeekday =
            (
              item.recurrence.weekdays ||
              []
            ).includes(
              cursor.getDay()
            );

          if (
            type === "daily" ||
            correctWeekday
          ) {
            output.push({
              ...item,

              occurrenceDate:
                dateToText(cursor),

              isOccurrence: true
            });
          }
        }
      }

      if (type === "monthly") {
        let cursor = new Date(
          begin.getFullYear(),
          begin.getMonth(),
          1,
          12
        );

        while (cursor <= toDate) {
          const chosenDay =
            Math.min(
              Number(
                item.recurrence.monthDay
              ),

              lastDayOfMonth(
                cursor.getFullYear(),
                cursor.getMonth()
              )
            );

          const occurrence =
            new Date(
              cursor.getFullYear(),
              cursor.getMonth(),
              chosenDay,
              12
            );

          if (
            occurrence >= begin &&
            occurrence >= start &&
            occurrence <= toDate
          ) {
            output.push({
              ...item,

              occurrenceDate:
                dateToText(occurrence),

              isOccurrence: true
            });
          }

          cursor = new Date(
            cursor.getFullYear(),
            cursor.getMonth() + 1,
            1,
            12
          );
        }
      }

      return output;
    }

    function visibleItemsForRange(
      selectedRange
    ) {
      const startDate = new Date(timelineStart);
      const endDate = new Date(timelineStart + selectedRange.days * DAY);

      const output = [];

      timelineEvents.forEach(item => {
        if (!["schedule", "milestone", "goal"].includes(item.type)) return;

        const itemDate =
          dateFromText(item.date);

        if (
          itemDate >= startDate &&
          itemDate <= endDate
        ) {
          output.push({
            ...item,
            occurrenceDate: item.date
          });
        }
      });

      return output.sort((a, b) => {
        return (
          dateFromText(
            a.occurrenceDate
          ) -
          dateFromText(
            b.occurrenceDate
          )
        );
      });
    }

    function isCompleted(item) {
      return (
        item.completedDates || []
      ).includes(
        item.occurrenceDate
      );
    }

    function updateTodayCount() {
      const today =
        todayAtNoon();

      const todayText =
        dateToText(today);

      let count = 0;

      timelineEvents
        .filter(item => {
          return item.type === "todo";
        })
        .forEach(item => {
          if (
            item.recurrence.type ===
            "none"
          ) {
            const unfinished =
              !(
                item.completedDates ||
                []
              ).includes(todayText);

            if (
              item.date === todayText &&
              unfinished
            ) {
              count++;
            }
          } else {
            const occurs =
              generateOccurrences(
                item,
                today,
                today
              ).some(item => {
                return (
                  item.occurrenceDate ===
                  todayText
                );
              });

            const unfinished =
              !(
                item.completedDates ||
                []
              ).includes(todayText);

            if (
              occurs &&
              unfinished
            ) {
              count++;
            }
          }
        });

      todoCount.textContent =
        `今日の未完了TO DO：${count}件`;
    }

    function todoGroups() {
      const today = todayAtNoon();
      const todayText = dateToText(today);
      const groups = { overdue: [], today: [], upcoming: [], repeating: [], completed: [] };
      timelineEvents.filter(item => item.type === "todo").forEach(item => {
        if (item.recurrence.type === "none") {
          const entry = { ...item, occurrenceDate: item.date };
          const group = isCompleted(entry) ? "completed"
            : item.date < todayText ? "overdue"
            : item.date === todayText ? "today" : "upcoming";
          groups[group].push(entry);
          return;
        }
        const start = dateFromText(item.date);
        const begin = start > today ? start : today;
        const occurrences = generateOccurrences(item, start, addDays(begin, 62));
        let nextIncluded = false;
        occurrences.forEach(entry => {
          if (isCompleted(entry)) return;
          if (entry.occurrenceDate <= todayText) {
            groups.repeating.push(entry);
          } else if (!nextIncluded) {
            groups.repeating.push(entry);
            nextIncluded = true;
          }
        });
        // Preserve all date-specific completion history, including future completions.
        [...new Set(item.completedDates)].forEach(date => {
          groups.completed.push({ ...item, occurrenceDate: date });
        });
      });
      Object.entries(groups).forEach(([key, entries]) => {
        entries.sort((a, b) => key === "completed"
          ? b.occurrenceDate.localeCompare(a.occurrenceDate)
          : a.occurrenceDate.localeCompare(b.occurrenceDate));
      });
      return groups;
    }

    function drawToday() {
      const labels = { overdue: "期限超過", today: "今日", upcoming: "今後", repeating: "繰り返し", completed: "完了済み" };
      const todayText = dateToText(todayAtNoon());
      todoLists.replaceChildren();
      Object.entries(todoGroups()).forEach(([key, entries]) => {
        const section = document.createElement("section");
        section.className = `todo-section ${key}`;
        const heading = document.createElement("h3");
        heading.textContent = labels[key];
        const count = document.createElement("span");
        count.textContent = `${entries.length}件`;
        heading.appendChild(count);
        section.appendChild(heading);
        const list = document.createElement("ul");
        list.className = "todo-list";
        entries.forEach(item => {
          const completed = isCompleted(item);
          const row = document.createElement("li");
          row.className = `todo-row${completed ? " completed" : ""}`;
          const toggle = document.createElement("button");
          toggle.type = "button";
          toggle.className = "todo-toggle";
          toggle.dataset.action = "complete";
          toggle.dataset.id = item.id;
          toggle.dataset.date = item.occurrenceDate;
          toggle.setAttribute("aria-pressed", String(completed));
          toggle.setAttribute("aria-label", `${item.title}（${item.occurrenceDate}）を${completed ? "未完了" : "完了"}にする`);
          toggle.textContent = completed ? "✓" : "";
          const content = document.createElement("div");
          content.className = "todo-content";
          const title = document.createElement("div");
          title.className = "todo-title";
          title.textContent = item.title;
          const meta = document.createElement("div");
          meta.className = "todo-meta";
          const due = item.occurrenceDate < todayText ? "期限超過" : item.occurrenceDate === todayText ? "今日" : "今後";
          meta.textContent = [formatDate(dateFromText(item.occurrenceDate)), recurrenceLabel(item), completed ? "完了" : due].filter(Boolean).join(" · ");
          content.append(title, meta);
          const remove = document.createElement("button");
          remove.type = "button";
          remove.className = "todo-delete";
          remove.dataset.action = "delete";
          remove.dataset.id = item.id;
          remove.textContent = "削除";
          remove.setAttribute("aria-label", `${item.title}を削除`);
          row.append(toggle, content, remove);
          list.appendChild(row);
        });
        section.appendChild(list);
        if (!entries.length) {
          const empty = document.createElement("p");
          empty.className = "todo-empty";
          empty.textContent = "該当するTO DOはありません";
          section.appendChild(empty);
        }
        todoLists.appendChild(section);
      });
    }

    function drawTimeline() {
      updateTodayCount();
      drawToday();
      renderTimeline();
    }

    function renderTimeline() {
      const selectedRange = { days: displayDays };

      const startDate = new Date(timelineStart);
      const endDate = new Date(timelineStart + selectedRange.days * DAY);

      const visibleEvents =
        visibleItemsForRange(
          selectedRange
        );

      rangeText.textContent = durationLabel(displayDays);
      zoom.setAttribute("aria-valuetext", durationLabel(displayDays));

      axisStart.textContent =
        formatDate(startDate);

      axisEnd.textContent =
        formatDate(endDate);

      if (
        visibleEvents.length === 0
      ) {
        eventsArea.innerHTML = `
          <div class="empty-message">
            この期間に登録された項目はありません
          </div>
        `;

        return;
      }

      eventsArea.innerHTML =
        visibleEvents
          .map((item, index) => {
            const itemDate =
              dateFromText(
                item.occurrenceDate
              );

            const difference = (itemDate.getTime() - timelineStart) / DAY;

            const percentage =
              Math.max(
                5,

                Math.min(
                  95,

                  5 +
                  (
                    difference /
                    selectedRange.days
                  ) *
                  90
                )
              );

            const lane =
              index % 2 === 0
                ? "above"
                : "below";

            const completed =
              item.type === "todo" &&
              !item.isSummary &&
              isCompleted(item);

            const repeat =
              recurrenceLabel(item);

            const completeButton =
              item.type === "todo" &&
              !item.isSummary

                ? `
                  <button
                    class="complete-button"
                    type="button"
                    data-action="complete"
                    data-id="${item.id}"
                    data-date="${item.occurrenceDate}"
                    aria-label="完了切り替え"
                  >
                    ${completed ? "✓" : ""}
                  </button>
                `

                : "";

            return `
              <div
                class="
                  event
                  ${lane}
                  ${item.type}
                  ${completed ? "completed" : ""}
                "
                style="left: ${percentage}%"
              >
                <div class="point"></div>

                <div class="event-card">
                  ${completeButton}

                  <button
                    class="delete-button"
                    type="button"
                    data-action="delete"
                    data-id="${item.id}"
                    aria-label="削除"
                  >
                    ×
                  </button>

                  <div class="event-title">
                    ${escapeText(item.title)}
                  </div>

                  <div class="event-date">
                    ${formatDate(itemDate)}
                  </div>

                  ${
                    repeat
                      ? `
                        <div class="repeat-label">
                          ${repeat}
                          ${
                            item.isSummary
                              ? "（まとめ表示）"
                              : ""
                          }
                        </div>
                      `
                      : ""
                  }
                </div>
              </div>
            `;
          })
          .join("");
    }

    function handleItemAction(event) {
        const button =
          event.target.closest(
            "button[data-action]"
          );

        if (!button) {
          return;
        }

        event.stopPropagation();

        const item =
          timelineEvents.find(entry => {
            return (
              entry.id ===
              button.dataset.id
            );
          });

        if (!item) {
          return;
        }

        if (
          button.dataset.action ===
          "complete"
        ) {
          const date =
            button.dataset.date;

          item.completedDates =
            item.completedDates || [];

          if (
            item.completedDates
              .includes(date)
          ) {
            item.completedDates =
              item.completedDates
                .filter(savedDate => {
                  return (
                    savedDate !== date
                  );
                });
          } else {
            item.completedDates = [
              ...item.completedDates,
              date
            ];
          }

          saveEvents();
          drawTimeline();
        }

        if (
          button.dataset.action ===
          "delete"
        ) {
          const repeating =
            item.type === "todo" &&
            item.recurrence.type !==
              "none";

          const message =
            repeating

              ? "この繰り返しTO DO全体を削除しますか？"

              : "この項目を削除しますか？";

          if (
            !window.confirm(message)
          ) {
            return;
          }

          timelineEvents =
            timelineEvents
              .filter(entry => {
                return (
                  entry.id !== item.id
                );
              });

          saveEvents();
          drawTimeline();
        }
    }

    eventsArea.addEventListener("click", handleItemAction);
    todoLists.addEventListener("click", handleItemAction);

    function updateRepeatControls() {
      repeatBox.classList.toggle(

        formPanel.classList.add("open");

        );

    eventForm.addEventListener(
      "submit",
      event => {
        event.preventDefault();

        const title =
          eventTitle.value.trim();

        const selectedDate =
          dateFromText(
            eventDate.value
          );

        const today =
          todayAtNoon();

        const difference =
          Math.round(
            (selectedDate - today) /
            DAY
          );

        if (difference < 0) {
          window.alert(
            "現在より後の日付を選んでください"
          );

          return;
        }

        let recurrence = {
          type: "none"
        };

        if (
          eventType.value === "todo"
        ) {
          recurrence = {
            type: repeatType.value
          };

          if (
            repeatType.value ===
            "weekly"
          ) {
            recurrence.weekdays =
              Array.from(
                document
                  .querySelectorAll(
                    'input[name="weekday"]:checked'
                  )
              )
              .map(box => {
                return Number(
                  box.value
                );
              });

            if (
              recurrence
                .weekdays
                .length === 0
            ) {
              window.alert(
                "曜日を1つ以上選んでください"
              );

              return;
            }
          }

          if (
            repeatType.value ===
            "monthly"
          ) {
            recurrence.monthDay =
              Number(
                monthDay.value
              );
          }
        }

        timelineEvents.push({
          id: makeId(),
          title: title,
          date: eventDate.value,
          type: eventType.value,
          recurrence: recurrence,
          completedDates: []
        });

        saveEvents();

        if (difference <= 1) {
          zoom.value = 0;
        } else if (
          difference <= 31
        ) {
          zoom.value = 1;
        } else if (
          difference <= 365
        ) {
          zoom.value = 2;
        } else if (
          difference <= 3650
        ) {
          zoom.value = 3;
        } else {
          zoom.value = 4;
        }
        displayDays = daysForZoom(Number(zoom.value));

        eventForm.reset();

        formPanel.classList.remove(
          "open"
        );

        updateRepeatControls();

        drawTimeline();
      }
    );

    zoom.addEventListener("input", () => {
      resetTimelineGesture();
      changeZoom(daysForZoom(Number(zoom.value)));
    });

    function changeZoom(days, fraction = 0.5,
                        anchorDate = timelineStart + fraction * displayDays * DAY) {
      if (!Number.isFinite(days) || !Number.isFinite(anchorDate)) return;
      displayDays = Math.max(1, Math.min(ranges[4].days, days));
      timelineStart = anchorDate - fraction * displayDays * DAY;
      zoom.value = zoomForDays(displayDays);
      requestTimelineDraw();
    }

    const fingers = new Map();
    let dragStart = null;
    let startingDistance = 0;
    let startingZoom = displayDays;
    let pinchAnchorDate = timelineStart;
    let gestureStartZoom = displayDays;
    let gestureAnchorDate = timelineStart;
    let gestureFraction = 0.5;
    let nativeGesture = false;

    function resetTimelineGesture() {
      const capturedIds = [...fingers.keys()];
      fingers.clear();
      dragStart = null;
      startingDistance = 0;
      nativeGesture = false;
      timeline.classList.remove("dragging");
      capturedIds.forEach(id => {
        if (timeline.hasPointerCapture(id)) timeline.releasePointerCapture(id);
      });
    }

    function getDistance() {
      const points = Array.from(fingers.values());
      return Math.hypot(points[0].x - points[1].x, points[0].y - points[1].y);
    }

    function pinchFraction() {
      const points = Array.from(fingers.values());
      return timelineFraction((points[0].x + points[1].x) / 2);
    }

    function startPinch() {
      startingDistance = getDistance();
      startingZoom = displayDays;
      pinchAnchorDate = timelineStart + pinchFraction() * displayDays * DAY;
    }

    timeline.addEventListener("pointerdown", event => {
      if (event.target.closest("button") ||
          (event.pointerType === "mouse" && event.button !== 0)) return;
      timeline.setPointerCapture(event.pointerId);
      fingers.set(event.pointerId, { x: event.clientX, y: event.clientY });
      if (fingers.size === 1 && !nativeGesture) {
        dragStart = {
          x: event.clientX,
          date: timelineStart,
          days: displayDays,
          // Event positions occupy 5–95% of the timeline width.
          width: Math.max(1, timeline.getBoundingClientRect().width * 0.9)
        };
      } else {
        dragStart = null;
        timeline.classList.remove("dragging");
        if (fingers.size === 2) {
          startPinch();
        }
      }
    });

    timeline.addEventListener("pointermove", event => {
      if (!fingers.has(event.pointerId)) return;
      fingers.set(event.pointerId, { x: event.clientX, y: event.clientY });
      if (fingers.size === 2 && startingDistance > 0) {
        const scale = getDistance() / startingDistance;
        if (scale > 0) {
          changeZoom(Math.exp(Math.log(startingZoom) - Math.log(scale)),
            pinchFraction(), pinchAnchorDate);
        }
      } else if (fingers.size === 1 && dragStart && !nativeGesture) {
        const distance = event.clientX - dragStart.x;
        timelineStart = dragStart.date - distance / dragStart.width * dragStart.days * DAY;
        timeline.classList.add("dragging");
        requestTimelineDraw();
      }
    });

    function removeFinger(event) {
      if (!fingers.delete(event.pointerId)) return;
      // After a pinch, require a fresh touch before starting another drag.
      dragStart = null;
      startingDistance = 0;
      timeline.classList.remove("dragging");
      if (timeline.hasPointerCapture(event.pointerId)) {
        timeline.releasePointerCapture(event.pointerId);
      }
      if (fingers.size === 2) {
        startPinch();
      }
    }

    ["pointerup", "pointercancel", "lostpointercapture"].forEach(name => {
      timeline.addEventListener(name, removeFinger);
    });
    window.addEventListener("blur", resetTimelineGesture);

    // Safari trackpad gestures remain supported. Touch pinch is handled by
    // pointer events when two pointers are present, avoiding double zooming.
    timeline.addEventListener("gesturestart", event => {
      event.preventDefault();
      nativeGesture = true;
      dragStart = null;
      timeline.classList.remove("dragging");
      gestureStartZoom = displayDays;
      gestureFraction = timelineFraction(event.clientX);
      gestureAnchorDate = timelineStart + gestureFraction * displayDays * DAY;
    }, { passive: false });

    timeline.addEventListener("gesturechange", event => {
      event.preventDefault();
      if (fingers.size > 0 || event.scale <= 0) return;
      changeZoom(Math.exp(Math.log(gestureStartZoom) - Math.log(event.scale)),
        gestureFraction, gestureAnchorDate);
    }, { passive: false });

    timeline.addEventListener("gestureend", event => {
      event.preventDefault();
      nativeGesture = false;
    }, { passive: false });

    timeline.addEventListener("wheel", event => {
      if (!event.ctrlKey) return;
      event.preventDefault();
      if (nativeGesture || fingers.size >= 2) return;
      dragStart = null;
      const pixels = event.deltaY * (event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? timeline.clientHeight : 1);
      const logDays = Math.max(0, Math.min(Math.log(ranges[4].days),
        Math.log(displayDays) + pixels * 0.005));
      changeZoom(Math.exp(logDays), timelineFraction(event.clientX));
    }, { passive: false });

    document.getElementById("returnTodayButton").addEventListener("click", () => {
      resetTimelineGesture();
      timelineStart = todayAtNoon().getTime();
      requestTimelineDraw();
    });

    eventDate.min =
      dateToText(todayAtNoon());

    updateRepeatControls();

    drawTimeline();
  </script>
</body>
</html>
